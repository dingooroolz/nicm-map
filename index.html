<style>

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{display:flex;height:100%}
#map{flex:1;position:relative;min-width:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#side{width:370px;background:var(--panel);border-left:1px solid var(--line);padding:28px 30px;overflow:auto;display:flex;flex-direction:column}
.org{color:var(--pb);font-size:12px;font-weight:600}
h1{margin:6px 0 10px;font-size:22px;line-height:1.15;font-weight:700}
.lead{color:var(--muted);font-size:13px;margin:0 0 18px}
.stats{display:flex;gap:18px;margin-bottom:18px}
.stat{display:flex;flex-direction:column}.stat b{font-size:28px;font-weight:700;line-height:1.1}.stat span{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--faint);font-size:11px;font-weight:600;text-align:left;padding:6px 0;border-bottom:1px solid var(--line)}
td{padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer;vertical-align:top}
tr:hover td,tr.on td{background:rgba(224,118,31,.08)}
td.r{text-align:right;color:var(--muted);white-space:nowrap;padding-left:8px}
td small{display:block;color:var(--muted);font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
.unset{margin-top:14px;font-size:12px;color:var(--muted)}
.foot{color:var(--faint);font-size:11px;margin-top:auto;padding-top:16px}
#detail{position:absolute;left:14px;bottom:14px;max-width:min(340px,calc(100% - 28px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.12);display:none}
#detail h2{margin:0 0 4px;font-size:16px}#detail p{margin:0;color:var(--muted);font-size:13px}#detail b{color:var(--ink)}
#ctl{position:absolute;top:14px;right:14px;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
#ctl button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;padding:6px 10px;border-radius:7px;cursor:pointer}#ctl button:hover{background:var(--line)}
#ctl button:focus-visible{outline:2px solid var(--pb)}
#legend{position:absolute;top:14px;left:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
#legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
#hint{position:absolute;bottom:14px;right:14px;font-size:12px;color:var(--faint)}
@media (max-width:760px){#app{flex-direction:column}#side{width:auto;border-left:0;border-top:1px solid var(--line);max-height:44%;padding:14px 16px}h1{font-size:18px}.lead{display:none}.stat b{font-size:22px}#hint{display:none}#legend{font-size:11px;gap:10px;max-width:calc(100% - 150px)}}
#side{display:none!important}
</style>

 const bar=cam.z>4?5:25;ctx.strokeStyle=C.ink;ctx.globalAlpha=.75;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(20,H-24);ctx.lineTo(20+bar*s,H-24);ctx.stroke();ctx.fillStyle=C.ink;ctx.font='600 11px Inter,Segoe UI,Roboto,sans-serif';ctx.textAlign='left';ctx.fillText(bar+' km',20,H-31);
 const nx=W-30,ny=70;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(nx,ny+40);ctx.lineTo(nx,ny+4);ctx.stroke();ctx.beginPath();ctx.moveTo(nx,ny);ctx.lineTo(nx-5,ny+12);ctx.lineTo(nx+5,ny+12);ctx.closePath();ctx.fill();ctx.textAlign='center';ctx.font='700 11px Inter,Segoe UI,Roboto,sans-serif';ctx.fillText('N',nx,ny+54);ctx.textAlign='left';ctx.globalAlpha=1;
}
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);draw();}
addEventListener('resize',()=>{resize();fitHome();draw();});
const det=document.getElementById('detail');
function select(i){sel=i;
 if(i>=1000){const a=AREAS[i-1000];document.getElementById('dname').textContent=a.n+', '+ST[a.st];document.getElementById('dtext').innerHTML='Area of work.<br><b>'+Math.round(a.km)+' km</b> ('+Math.round(a.km*0.621)+' mi) '+a.dir+' of the main mission school, in a straight line.'+(a.approx?'<br>Position approximate.':'');det.style.display='block';draw();return;}
 if(i>=0){const t=T[i];document.getElementById('dname').textContent=t.n+', '+ST[t.st];
  let txt=t.campus?'NICM\'s main mission school, at Alipur in the HSIIDC estate, Barwala.':'NICM pastoral work.<br><b>'+Math.round(t.km)+' km</b> ('+Math.round(t.km*0.621)+' mi) '+t.dir+' of the main mission school, in a straight line.';
  if(t.note)txt+='<br>'+t.note+'.';if(t.approx)txt+='<br>Position approximate.';
  document.getElementById('dtext').innerHTML=txt;det.style.display='block';}
 else det.style.display='none';draw();}
function flyTo(x,y,z){const t0=performance.now(),sx=cam.x,sy=cam.y,sz=cam.z,tz=z||cam.z;const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const step=t=>{const k=red?1:Math.min(1,(t-t0)/500),e=1-Math.pow(1-k,3);cam.x=sx+(x-sx)*e;cam.y=sy+(y-sy)*e;cam.z=sz+(tz-sz)*e;draw();if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}
// interaction
let drag=null,p2=null,moved=false;
function pos(e){const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
function hit(p){let best=-1,bd=1e9;hits.forEach(h=>{const d=Math.hypot(h.x-p.x,h.y-p.y);if(d<h.r&&d<bd){bd=d;best=h.i;}});return best;}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const p=pos(e);if(!drag){drag={id:e.pointerId,x:p.x,y:p.y,cx:cam.x,cy:cam.y};moved=false;}else if(!p2){p2={id:e.pointerId,x:p.x,y:p.y,z:cam.z,cur:p};drag.cur={x:drag.x,y:drag.y};}});
cv.addEventListener('pointermove',e=>{const p=pos(e);
 if(p2&&drag&&(e.pointerId===p2.id||e.pointerId===drag.id)){if(e.pointerId===p2.id)p2.cur=p;else drag.cur=p;const d0=Math.hypot(p2.x-drag.x,p2.y-drag.y),d1=Math.hypot(p2.cur.x-drag.cur.x,p2.cur.y-drag.cur.y);cam.z=Math.max(.6,Math.min(30,p2.z*d1/d0));moved=true;draw();return;}
 if(drag&&e.pointerId===drag.id){const s=base()*cam.z;const dx=p.x-drag.x,dy=p.y-drag.y;if(Math.hypot(dx,dy)>4)moved=true;cam.x=drag.cx-dx/s;cam.y=drag.cy+dy/s;draw();return;}
 const h=hit(p);if(h!==hover){hover=h;cv.style.cursor=h>=0?'pointer':'grab';draw();}});
function end(e){if(p2&&e.pointerId===p2.id){p2=null;return;}if(drag&&e.pointerId===drag.id){if(!moved)select(hit(pos(e)));drag=null;p2=null;}}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
cv.addEventListener('wheel',e=>{e.preventDefault();const p=pos(e),before=unproj(p.x,p.y);cam.z=Math.max(.6,Math.min(30,cam.z*Math.exp(-e.deltaY*0.0015)));const after=unproj(p.x,p.y);cam.x+=before.x-after.x;cam.y+=before.y-after.y;draw();},{passive:false});
document.getElementById('reset').onclick=()=>{Object.assign(cam,HOME);select(-1);};
document.getElementById('theme').onclick=()=>{const r=document.documentElement;const cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.setAttribute('data-theme',cur==='dark'?'light':'dark');try{localStorage.setItem('pastors-theme',r.getAttribute('data-theme'));}catch(e){}draw();};
try{const t=localStorage.getItem('pastors-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
resize();fitHome();draw();
})();
</script>
